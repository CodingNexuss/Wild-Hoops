<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Wild Hoops - Basquete Arcade</title>
<style>
  :root{
    --bg1:#1a0f2e; --bg2:#0d0620; --accent:#ffb703; --accent2:#ff5e5b;
    --panel:#241242; --panel-light:#3a1e63; --text:#fff2e0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000;
    font-family:'Segoe UI', Arial, sans-serif; touch-action:none;}
  #app{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 20%, var(--bg1), var(--bg2) 70%);}
  #gameCanvas{display:block; background:#87ceeb; border-radius:6px; box-shadow:0 0 40px rgba(0,0,0,.6);}

  .overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--text); text-align:center; z-index:20;}
  .hidden{display:none !important;}

  #mainMenu{background:linear-gradient(160deg, var(--bg1), var(--bg2));}
  .logo{font-size:clamp(38px,9vw,72px); font-weight:900; letter-spacing:2px; margin-bottom:6px;
    color:var(--accent); text-shadow:0 0 18px rgba(255,183,3,.6), 3px 3px 0 var(--accent2);
    font-style:italic;}
  .logo span{color:var(--text); text-shadow:0 0 18px rgba(255,255,255,.4), 3px 3px 0 #7a2ab0;}
  .subtitle{color:#c9b6ea; margin-bottom:34px; font-size:clamp(12px,2.4vw,16px); letter-spacing:3px; text-transform:uppercase;}

  .menuBtn{
    width:min(300px,70vw); padding:14px 20px; margin:7px 0; font-size:18px; font-weight:800;
    letter-spacing:1px; border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(180deg, var(--panel-light), var(--panel));
    color:var(--text); box-shadow:0 5px 0 #150a2b, 0 8px 14px rgba(0,0,0,.4);
    transition:transform .08s;
  }
  .menuBtn.primary{background:linear-gradient(180deg,#ffcf4d,var(--accent)); color:#3a1e00; box-shadow:0 5px 0 #a56900, 0 8px 14px rgba(0,0,0,.4);}
  .menuBtn:active{transform:translateY(4px); box-shadow:0 1px 0 #150a2b;}
  .menuBtn.primary:active{box-shadow:0 1px 0 #a56900;}
  .menuBtn:disabled{opacity:.45; cursor:not-allowed;}

  #toast{position:absolute; bottom:6%; background:rgba(0,0,0,.75); color:#fff; padding:10px 18px;
    border-radius:20px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:60;}
  #toast.show{opacity:1;}

  /* Character select */
  .charGrid{display:flex; gap:22px; margin:18px 0 26px; flex-wrap:wrap; justify-content:center;}
  .charCard{width:150px; padding:14px 10px; border-radius:16px; cursor:pointer;
    background:var(--panel); border:3px solid transparent; transition:.15s;}
  .charCard.selected{border-color:var(--accent); background:var(--panel-light); transform:scale(1.05);}
  .charCard canvas{display:block; margin:0 auto 6px;}
  .charCard h3{margin:4px 0 8px; color:var(--accent); font-size:16px;}
  .statBar{display:flex; align-items:center; gap:6px; font-size:10px; margin:2px 0; color:#cbb8ea;}
  .statBar .track{flex:1; height:6px; background:#150a2b; border-radius:3px; overflow:hidden;}
  .statBar .fill{height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent));}

  .diffRow{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; justify-content:center;}
  .diffBtn{padding:8px 16px; border-radius:20px; border:2px solid var(--panel-light); background:transparent;
    color:var(--text); font-weight:700; cursor:pointer; font-size:13px;}
  .diffBtn.selected{background:var(--accent); color:#3a1e00; border-color:var(--accent);}

  /* HUD */
  #hud{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
    padding:10px 14px; pointer-events:none; z-index:15; font-weight:800; color:#fff;}
  .hudSide{display:flex; flex-direction:column; align-items:center; min-width:76px;}
  .hudSide .nm{font-size:clamp(11px,2vw,14px); text-shadow:1px 1px 2px #000;}
  .hudSide .sc{font-size:clamp(22px,4.5vw,34px); text-shadow:2px 2px 0 rgba(0,0,0,.5); line-height:1;}
  .energyTrack{width:64px; height:6px; background:rgba(0,0,0,.5); border-radius:3px; margin-top:4px; overflow:hidden; border:1px solid rgba(255,255,255,.3);}
  .energyFill{height:100%; background:linear-gradient(90deg,#4dd0e1,#00838f); width:100%;}
  #clock{font-size:clamp(20px,4vw,30px); background:rgba(0,0,0,.45); padding:4px 14px; border-radius:10px;
    text-shadow:2px 2px 0 rgba(0,0,0,.5); align-self:center;}
  #pauseBtn{position:absolute; top:10px; right:10px; pointer-events:auto; background:rgba(0,0,0,.45); color:#fff;
    border:none; width:38px; height:38px; border-radius:10px; font-size:18px; z-index:16; cursor:pointer;}

  #banner{position:absolute; top:16%; left:50%; transform:translate(-50%,-10px); font-size:clamp(26px,6vw,50px);
    font-weight:900; color:var(--accent); text-shadow:3px 3px 0 rgba(0,0,0,.6); opacity:0; z-index:25;
    pointer-events:none; letter-spacing:1px; transition:opacity .15s, transform .15s;}
  #banner.show{opacity:1; transform:translate(-50%,0);}

  /* Touch controls */
  #touchControls{position:absolute; inset:0; z-index:14; pointer-events:none;}
  #joyBase{position:absolute; left:26px; bottom:26px; width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.35); pointer-events:auto;}
  #joyThumb{position:absolute; width:52px; height:52px; border-radius:50%; background:rgba(255,183,3,.85);
    left:34px; top:34px; box-shadow:0 2px 6px rgba(0,0,0,.4);}
  .actBtn{position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#fff; pointer-events:auto; border:2px solid rgba(255,255,255,.4); text-align:center; line-height:1.1;}
  #btnShoot{right:26px; bottom:36px; width:84px; height:84px; background:rgba(255,94,91,.75); font-size:13px;}
  #btnJump{right:120px; bottom:100px; width:60px; height:60px; background:rgba(77,208,225,.75); font-size:11px;}
  #btnSteal{right:20px; bottom:130px; width:58px; height:58px; background:rgba(149,117,205,.75); font-size:10px;}
  #btnSpecial{right:110px; bottom:20px; width:64px; height:64px; background:rgba(255,183,3,.85); color:#3a1e00; font-size:10px;}
  #btnRun{left:150px; bottom:36px; width:56px; height:56px; background:rgba(255,255,255,.18); font-size:10px;}

  #powerBarWrap{position:absolute; left:50%; bottom:22%; transform:translateX(-50%); width:180px; height:16px;
    background:rgba(0,0,0,.5); border-radius:8px; border:2px solid rgba(255,255,255,.4); z-index:22; overflow:hidden;}
  #powerZonePerfect,#powerZoneGood{position:absolute; top:0; bottom:0;}
  #powerZonePerfect{background:rgba(76,255,120,.55);}
  #powerZoneGood{background:rgba(255,221,89,.4);}
  #powerCursor{position:absolute; top:-3px; width:4px; height:22px; background:#fff; border-radius:2px;}

  #gameOver, #pauseMenu{background:rgba(10,4,24,.92); z-index:40;}
  #gameOver h1{font-size:clamp(30px,7vw,56px); color:var(--accent); margin-bottom:4px; text-shadow:3px 3px 0 rgba(0,0,0,.5);}
  #gameOver p{color:#cbb8ea; margin:4px 0 22px;}

  @media (hover:hover) and (pointer:fine){ #touchControls{display:none;} }
  #kbHint{position:absolute; bottom:10px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.55);
    font-size:12px; z-index:15; pointer-events:none;}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hudSide">
      <div class="nm" id="p1Name">VOCÊ</div>
      <div class="sc" id="p1Score">0</div>
      <div class="energyTrack"><div class="energyFill" id="p1Energy"></div></div>
    </div>
    <div id="clock">01:30</div>
    <div class="hudSide">
      <div class="nm" id="p2Name">CPU</div>
      <div class="sc" id="p2Score">0</div>
      <div class="energyTrack"><div class="energyFill" id="p2Energy"></div></div>
    </div>
  </div>
  <button id="pauseBtn" class="hidden">⏸</button>
  <div id="banner"></div>
  <div id="powerBarWrap" class="hidden">
    <div id="powerZoneGood"></div><div id="powerZonePerfect"></div>
    <div id="powerCursor"></div>
  </div>
  <div id="kbHint" class="hidden">WASD/Setas: mover · Espaço: pular · J: arremesso/enterrada · E: roubar/bloquear · Shift: correr · L: habilidade</div>

  <!-- Touch Controls -->
  <div id="touchControls" class="hidden">
    <div id="joyBase"><div id="joyThumb"></div></div>
    <div id="btnRun" class="actBtn">CORRER</div>
    <div id="btnJump" class="actBtn">PULAR</div>
    <div id="btnSteal" class="actBtn">ROUBAR</div>
    <div id="btnSpecial" class="actBtn">ESPECIAL</div>
    <div id="btnShoot" class="actBtn">ARREMESSO</div>
  </div>

  <!-- Main Menu -->
  <div id="mainMenu" class="overlay">
    <div class="logo">WILD <span>HOOPS</span></div>
    <div class="subtitle">Basquete Arcade Animal</div>
    <button class="menuBtn primary" id="btnPlay">🏀 JOGAR</button>
    <button class="menuBtn" id="btnChars">PERSONAGENS</button>
    <button class="menuBtn" id="btnCustom">PERSONALIZAÇÃO</button>
    <button class="menuBtn" id="btnTourney">TORNEIO</button>
    <button class="menuBtn" id="btnPractice">TREINAMENTO</button>
    <button class="menuBtn" id="btnSettings">CONFIGURAÇÕES</button>
  </div>

  <!-- Character / Difficulty Select -->
  <div id="selectScreen" class="overlay hidden">
    <div class="subtitle" style="margin-bottom:6px;">ESCOLHA SEU ANIMAL</div>
    <div class="charGrid" id="charGrid"></div>
    <div class="subtitle" style="margin-bottom:6px;">DIFICULDADE DA IA</div>
    <div class="diffRow" id="diffRow"></div>
    <button class="menuBtn primary" id="btnStartMatch">INICIAR PARTIDA (1v1)</button>
    <button class="menuBtn" id="btnBackFromSelect">VOLTAR</button>
  </div>

  <!-- Pause -->
  <div id="pauseMenu" class="overlay hidden">
    <div class="logo" style="font-size:32px;">PAUSADO</div>
    <button class="menuBtn primary" id="btnResume">CONTINUAR</button>
    <button class="menuBtn" id="btnQuitToMenu">SAIR PARA O MENU</button>
  </div>

  <!-- Game Over -->
  <div id="gameOver" class="overlay hidden">
    <h1 id="goTitle">VITÓRIA!</h1>
    <p id="goSub">Você 12 - 8 CPU</p>
    <button class="menuBtn primary" id="btnPlayAgain">JOGAR NOVAMENTE</button>
    <button class="menuBtn" id="btnGoMenu">MENU PRINCIPAL</button>
  </div>

  <div id="toast"></div>
</div>

<script>
/* =====================================================================
   WILD HOOPS - MVP jogável
   Arquitetura (organizada em seções para futura divisão em módulos):
   CONFIG > AUDIO > CHARACTERS > PHYSICS > ENTITIES > AI > CONTROLS >
   UI/HUD > ARENA (render) > GAME (state machine / loop)
   ===================================================================== */

/* ---------------------- CONFIG ---------------------- */
const CONFIG = {
  W: 1280, H: 720,
  GROUND_Y: 600,
  GRAVITY: 1900,
  HOOP_X: 1150, HOOP_Y: 250, RIM_R: 34,
  DUNK_ZONE_X: 1000,
  THREE_PT_X: 620,
  MATCH_TIME: 90,
  PLAYER_R: 34,
  BALL_R: 14,
  COURT_LEFT: 70, COURT_RIGHT: 1230,
};

/* ---------------------- AUDIO (sintetizado, sem arquivos) ---------------------- */
const Audio_ = (() => {
  let ctxA = null;
  function ensure(){ if(!ctxA){ ctxA = new (window.AudioContext||window.webkitAudioContext)(); } return ctxA; }
  function tone(freq, dur, type='sine', vol=0.18, delay=0){
    try{
      const c = ensure();
      const t0 = c.currentTime + delay;
      const osc = c.createOscillator(); const g = c.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      osc.connect(g); g.connect(c.destination);
      osc.start(t0); osc.stop(t0+dur+0.02);
    }catch(e){}
  }
  function noise(dur, vol=0.15){
    try{
      const c = ensure();
      const bufferSize = c.sampleRate*dur;
      const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1)*(1-i/bufferSize); }
      const src = c.createBufferSource(); src.buffer = buffer;
      const g = c.createGain(); g.gain.value = vol;
      src.connect(g); g.connect(c.destination); src.start();
    }catch(e){}
  }
  return {
    bounce(){ tone(180,0.08,'sine',0.12); },
    score(){ tone(660,0.1,'triangle',0.2); tone(880,0.12,'triangle',0.2,0.09); tone(1180,0.18,'triangle',0.2,0.18); },
    swish(){ tone(1400,0.12,'sine',0.1); },
    dunk(){ tone(90,0.25,'sawtooth',0.25); noise(0.2,0.12); },
    steal(){ tone(920,0.08,'square',0.14); },
    block(){ tone(140,0.15,'square',0.2); },
    whistle(){ tone(1600,0.35,'square',0.15); },
    special(){ tone(500,0.1,'sawtooth',0.15); tone(900,0.1,'sawtooth',0.15,0.08); },
    buzzer(){ tone(220,0.6,'sawtooth',0.2); },
  };
})();

/* ---------------------- CHARACTERS ---------------------- */
const CHARACTERS = {
  leao: {
    id:'leao', name:'Leão', bodyColor:'#E3A857', maneColor:'#B5651D', accent:'#7a3b00',
    speed:250, force:95, jump:58, accuracy:55, dribble:42, defense:68, energyMax:100,
    ability:{ name:'Roar Dunk', duration:5, cooldown:12, cost:40, type:'force_boost' },
    emoji:'🦁'
  },
  raposa: {
    id:'raposa', name:'Raposa', bodyColor:'#FF8C42', maneColor:'#ffffff', accent:'#c95a10',
    speed:360, force:38, jump:66, accuracy:70, dribble:92, defense:44, energyMax:100,
    ability:{ name:'Fox Dash', duration:3, cooldown:10, cost:35, type:'speed_boost' },
    emoji:'🦊'
  }
};

/* ---------------------- ENTITIES ---------------------- */
function makePlayer(charId, isAI, side){
  const c = CHARACTERS[charId];
  return {
    char:c, isAI, side,
    x: isAI ? CONFIG.COURT_RIGHT-160 : CONFIG.COURT_LEFT+160,
    y: CONFIG.GROUND_Y, vy:0, vx:0, onGround:true,
    facing:1, hasBall:false, score:0,
    energy:c.energyMax, abilityUntil:0, abilityReadyAt:0,
    stealCooldown:0, shootState:null, // {power, dir, holdTime}
    aiTimer:0, aiTargetX:null, aiIntent:'idle',
    dribblePhase:0, hurtFlash:0, contestNearby:false,
  };
}
function makeBall(){
  return { x:CONFIG.W/2, y:CONFIG.GROUND_Y-40, vx:0, vy:0, owner:null, state:'free', spin:0, flightT:0, flightDur:0, from:null, quality:null };
}

/* ---------------------- GAME STATE ---------------------- */
const G = {
  state:'menu', // menu, select, playing, paused, gameover
  p1:null, p2:null, ball:null,
  timeLeft:CONFIG.MATCH_TIME,
  difficulty:'normal',
  selectedChar:'raposa',
  particles:[], floaters:[],
  lastPossessionLoserSide:null,
  bannerTimer:0,
  shakeT:0,
};

const DIFF = {
  facil:   { reaction:0.35, stealChance:0.14, shotSkill:0.35, aggressiveness:0.3, mistake:0.35 },
  normal:  { reaction:0.55, stealChance:0.24, shotSkill:0.55, aggressiveness:0.5, mistake:0.2 },
  dificil: { reaction:0.75, stealChance:0.34, shotSkill:0.72, aggressiveness:0.7, mistake:0.1 },
  insano:  { reaction:0.95, stealChance:0.46, shotSkill:0.9,  aggressiveness:0.9, mistake:0.03 },
};

/* ---------------------- CONTROLS ---------------------- */
const Input = {
  keys:{}, joy:{active:false, dx:0, dy:0, id:null},
  shootHeld:false, runHeld:false,
  isTouch: ('ontouchstart' in window) || navigator.maxTouchPoints>0,
};
window.addEventListener('keydown', e=>{
  Input.keys[e.key.toLowerCase()] = true;
  if(e.key===' ') e.preventDefault();
  handleKeyAction(e.key.toLowerCase(), true);
});
window.addEventListener('keyup', e=>{
  Input.keys[e.key.toLowerCase()] = false;
  handleKeyAction(e.key.toLowerCase(), false);
});
function handleKeyAction(k, down){
  if(G.state!=='playing') return;
  if(k==='j'){ if(down) tryShootStart(G.p1); else tryShootRelease(G.p1); }
  if(k==='e' && down){ tryStealOrBlock(G.p1); }
  if(k==='l' && down){ tryActivateAbility(G.p1); }
  if(k===' ' && down){ tryJump(G.p1); }
}

/* ---------------------- UI helpers ---------------------- */
function $(id){ return document.getElementById(id); }
function showToast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 1600);
}
function showBanner(msg, color){
  const b = $('banner'); b.textContent = msg; b.style.color = color||'var(--accent)';
  b.classList.add('show'); G.bannerTimer = 1.1;
}
function screen(name){
  ['mainMenu','selectScreen','pauseMenu','gameOver'].forEach(id=>$(id).classList.add('hidden'));
  if(name) $(name).classList.remove('hidden');
}

/* ---------------------- Character select build ---------------------- */
function buildCharGrid(){
  const grid = $('charGrid'); grid.innerHTML='';
  Object.values(CHARACTERS).forEach(c=>{
    const card = document.createElement('div');
    card.className='charCard'+(c.id===G.selectedChar?' selected':'');
    card.innerHTML = `
      <div style="font-size:54px;">${c.emoji}</div>
      <h3>${c.name}</h3>
      <div class="statBar">VEL<div class="track"><div class="fill" style="width:${c.speed/4}%"></div></div></div>
      <div class="statBar">FOR<div class="track"><div class="fill" style="width:${c.force}%"></div></div></div>
      <div class="statBar">SAL<div class="track"><div class="fill" style="width:${c.jump}%"></div></div></div>
      <div class="statBar">PRE<div class="track"><div class="fill" style="width:${c.accuracy}%"></div></div></div>
      <div class="statBar">DRI<div class="track"><div class="fill" style="width:${c.dribble}%"></div></div></div>
      <div style="font-size:11px;color:#ffb703;margin-top:6px;">✨ ${c.ability.name}</div>
    `;
    card.onclick = ()=>{ G.selectedChar = c.id; buildCharGrid(); };
    grid.appendChild(card);
  });
}
function buildDiffRow(){
  const row = $('diffRow'); row.innerHTML='';
  [['facil','Fácil'],['normal','Normal'],['dificil','Difícil'],['insano','Insano']].forEach(([id,label])=>{
    const b = document.createElement('button');
    b.className='diffBtn'+(G.difficulty===id?' selected':'');
    b.textContent = label;
    b.onclick = ()=>{ G.difficulty=id; buildDiffRow(); };
    row.appendChild(b);
  });
}

/* ---------------------- Menu wiring ---------------------- */
$('btnPlay').onclick = ()=>{ screen('selectScreen'); buildCharGrid(); buildDiffRow(); };
$('btnChars').onclick = ()=> showToast('Galeria completa de personagens: em breve!');
$('btnCustom').onclick = ()=> showToast('Personalização de roupas e tênis: em breve!');
$('btnTourney').onclick = ()=> showToast('Modo Torneio: em breve!');
$('btnPractice').onclick = ()=> showToast('Modo Treinamento: em breve! Use Partida Rápida para praticar.');
$('btnSettings').onclick = ()=> showToast('Controles já são configuráveis via teclado (WASD/Setas). Mais opções em breve.');
$('btnBackFromSelect').onclick = ()=> screen('mainMenu');
$('btnStartMatch').onclick = ()=> startMatch();
$('btnResume').onclick = ()=> resumeGame();
$('btnQuitToMenu').onclick = ()=> quitToMenu();
$('btnPlayAgain').onclick = ()=> startMatch();
$('btnGoMenu').onclick = ()=> quitToMenu();
$('pauseBtn').onclick = ()=> togglePause();
window.addEventListener('keydown', e=>{ if(e.key==='Escape' && (G.state==='playing'||G.state==='paused')) togglePause(); });

/* ---------------------- Match lifecycle ---------------------- */
function startMatch(){
  G.p1 = makePlayer(G.selectedChar, false, 'left');
  const aiChar = G.selectedChar==='leao' ? 'raposa' : 'leao';
  G.p2 = makePlayer(aiChar, true, 'right');
  G.ball = makeBall();
  G.ball.x = CONFIG.W/2; G.ball.y = CONFIG.GROUND_Y-30; G.ball.state='free'; G.ball.vx=0; G.ball.vy=0;
  G.timeLeft = CONFIG.MATCH_TIME;
  G.particles=[]; G.floaters=[];
  G.state='playing';
  screen(null);
  $('hud').classList.remove('hidden');
  $('pauseBtn').classList.remove('hidden');
  if(Input.isTouch) $('touchControls').classList.remove('hidden');
  else $('kbHint').classList.remove('hidden');
  $('p1Name').textContent = G.p1.char.name.toUpperCase();
  $('p2Name').textContent = 'CPU · ' + G.p2.char.name.toUpperCase();
  showBanner('INÍCIO DE JOGO!','#ffb703');
  Audio_.whistle();
}
function togglePause(){
  if(G.state==='playing'){ G.state='paused'; screen('pauseMenu'); }
  else if(G.state==='paused'){ resumeGame(); }
}
function resumeGame(){ G.state='playing'; screen(null); }
function quitToMenu(){
  G.state='menu'; screen('mainMenu');
  $('hud').classList.add('hidden'); $('pauseBtn').classList.add('hidden');
  $('touchControls').classList.add('hidden'); $('kbHint').classList.add('hidden');
  $('powerBarWrap').classList.add('hidden');
}
function endMatch(){
  G.state='gameover';
  const win = G.p1.score > G.p2.score;
  const tie = G.p1.score === G.p2.score;
  $('goTitle').textContent = tie ? 'EMPATE!' : (win ? 'VITÓRIA!' : 'DERROTA');
  $('goTitle').style.color = tie ? '#ffd166' : (win ? '#7CFC00' : '#ff5e5b');
  $('goSub').textContent = `${G.p1.char.name} ${G.p1.score} - ${G.p2.score} ${G.p2.char.name} (CPU)`;
  screen('gameOver');
  Audio_.buzzer();
}

/* ---------------------- Physics helpers ---------------------- */
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx, ay-by); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ---------------------- Actions: jump / shoot / steal / ability ---------------------- */
function tryJump(p){
  if(p.onGround){ p.vy = -Math.sqrt(2*CONFIG.GRAVITY*(60+p.char.jump*1.1)); p.onGround=false; }
}
function inDunkZone(p){ return p.x > CONFIG.DUNK_ZONE_X; }
function tryShootStart(p){
  if(!p.hasBall || p.shootState) return;
  if(inDunkZone(p)){
    // instant dunk sequence
    doDunk(p);
    return;
  }
  p.shootState = { t:0, dir:1, power:0 };
}
function tryShootRelease(p){
  if(!p.hasBall || !p.shootState || p.shootState.dunk) return;
  const quality = classifyPower(p.shootState.power);
  performShot(p, quality);
  p.shootState = null;
}
function classifyPower(power){
  // power 0-100, perfect zone 78-94, good 55-78 & 94-100, else bad
  if(power>=78 && power<=94) return 'perfect';
  if((power>=55 && power<78) || (power>94)) return 'good';
  return 'ruim';
}
function doDunk(p){
  const opp = p===G.p1 ? G.p2 : G.p1;
  const success = Math.random() < clamp(0.55 + p.char.force/220 + (p.abilityUntil>nowT()?0.2:0), 0.3, 0.97);
  p.shootState = { dunk:true, t:0 };
  p.hasBall = false;
  G.ball.state='inflight'; G.ball.flightT=0; G.ball.flightDur=0.45;
  G.ball.from = {x:p.x, y:p.y-40}; G.ball.to = {x:CONFIG.HOOP_X, y:CONFIG.HOOP_Y};
  G.ball.arcH = 10; G.ball.dunkSuccess = success; G.ball.shooter = p; G.ball.isDunk=true;
  Audio_.dunk();
  shakeScreen(0.25);
}
function performShot(p, quality){
  const opp = p===G.p1 ? G.p2 : G.p1;
  let baseChance = 0.5 + (p.char.accuracy-50)/140;
  if(quality==='perfect') baseChance += 0.35;
  else if(quality==='good') baseChance += 0.08;
  else baseChance -= 0.28;
  const distFactor = p.x < CONFIG.THREE_PT_X ? -0.12 : 0.05;
  baseChance += distFactor;
  if(p.abilityUntil>nowT() && p.char.ability.type==='force_boost') baseChance += 0.05;
  // contested shot: opponent close reduces chance
  const contested = dist(p.x,p.y,opp.x,opp.y) < 90;
  if(contested) baseChance -= (opp.char.defense/260);
  const success = Math.random() < clamp(baseChance,0.04,0.95);
  const isThree = p.x < CONFIG.THREE_PT_X;

  p.hasBall = false;
  G.ball.state='inflight'; G.ball.flightT=0; G.ball.flightDur=0.75;
  G.ball.from = {x:p.x, y:p.y-46}; G.ball.to = {x:CONFIG.HOOP_X, y:CONFIG.HOOP_Y};
  G.ball.arcH = 220; G.ball.shooter = p; G.ball.isThree = isThree; G.ball.shotSuccess = success; G.ball.isDunk=false;
  G.ball.quality = quality;
  if(quality==='perfect') Audio_.swish();
}
function landBallResult(){
  const b = G.ball; const p = b.shooter;
  if(b.isDunk){
    if(b.dunkSuccess){
      addScore(p, 2);
      showBanner('ENTERRADA!!! 💥', '#ff5e5b');
      spawnParticles(CONFIG.HOOP_X, CONFIG.HOOP_Y, '#ff5e5b', 26);
      Audio_.score();
      resetBallAfterScore(p);
    } else {
      showBanner('BLOQUEIO DO ARO!', '#aaa');
      looseBallBounce(CONFIG.HOOP_X-20, CONFIG.HOOP_Y);
    }
    return;
  }
  if(b.shotSuccess){
    const pts = b.isThree ? 3 : 2;
    addScore(p, pts);
    showBanner(pts===3?'CESTA DE 3!! 🔥':'CESTA! +2', pts===3?'#ffd166':'#7CFC00');
    spawnParticles(CONFIG.HOOP_X, CONFIG.HOOP_Y, '#ffd166', pts===3?30:18);
    Audio_.score();
    resetBallAfterScore(p);
  } else {
    floater(CONFIG.HOOP_X, CONFIG.HOOP_Y-10, 'ERROU', '#ff8888');
    looseBallBounce(CONFIG.HOOP_X + (Math.random()*80-40), CONFIG.HOOP_Y+20);
  }
}
function resetBallAfterScore(scorer){
  const opp = scorer===G.p1 ? G.p2 : G.p1;
  G.ball.state='held'; G.ball.owner=opp; opp.hasBall=true; scorer.hasBall=false;
  G.ball.x = opp.x; G.ball.y = opp.y-40;
}
function looseBallBounce(x,y){
  G.ball.state='free'; G.ball.x=x; G.ball.y=y; G.ball.vx=(Math.random()*260-130); G.ball.vy=-260; G.ball.owner=null;
}
function addScore(p,pts){ p.score += pts; $(p===G.p1?'p1Score':'p2Score').textContent = p.score; }

function tryStealOrBlock(p){
  const opp = p===G.p1 ? G.p2 : G.p1;
  if(p.stealCooldown>0) return;
  p.stealCooldown = 0.7;
  const d = dist(p.x,p.y,opp.x,opp.y);
  if(d>95) return;
  if(opp.shootState && !opp.shootState.dunk){
    // block attempt during windup
    const chance = clamp(0.25 + p.char.defense/180, 0.1, 0.75);
    if(Math.random()<chance){
      opp.shootState=null; opp.hasBall=false;
      looseBallBounce(opp.x + (opp===G.p1?60:-60), opp.y-30);
      showBanner('BLOQUEIO!','#4dd0e1'); Audio_.block();
    }
    return;
  }
  if(opp.hasBall){
    const chance = clamp(0.5 + (p.char.defense - opp.char.dribble)/200, 0.06, 0.7);
    if(Math.random()<chance){
      opp.hasBall=false; p.hasBall=true; G.ball.owner=p; G.ball.state='held';
      showBanner('ROUBO DE BOLA!','#95c8ff'); Audio_.steal();
    }
  }
}
function nowT(){ return performance.now()/1000; }
function tryActivateAbility(p){
  if(nowT() < p.abilityReadyAt) return;
  if(p.energy < p.char.ability.cost) { showToast('Energia insuficiente'); return; }
  p.energy -= p.char.ability.cost;
  p.abilityUntil = nowT() + p.char.ability.duration;
  p.abilityReadyAt = nowT() + p.char.ability.duration + p.char.ability.cooldown;
  showBanner('✨ '+p.char.ability.name+'!', '#ffb703');
  spawnParticles(p.x,p.y-30,'#ffb703',16);
  Audio_.special();
}

/* ---------------------- Particles / floaters ---------------------- */
function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    G.particles.push({x,y,vx:(Math.random()*2-1)*220,vy:(Math.random()*-260-40),life:0.6+Math.random()*0.4,color,size:3+Math.random()*4});
  }
}
function floater(x,y,text,color){ G.floaters.push({x,y,text,color,life:1.0}); }
function shakeScreen(t){ G.shakeT = Math.max(G.shakeT,t); }

/* ---------------------- AI ---------------------- */
function updateAI(dt){
  const ai = G.p2, hu = G.p1, ball = G.ball;
  const d = DIFF[G.difficulty];
  ai.aiTimer -= dt;

  if(ball.state==='free'){
    // chase loose ball
    moveToward(ai, ball.x, dt, 1);
    if(dist(ai.x,ai.y,ball.x,ball.y) < 40 && Math.abs(ai.y-CONFIG.GROUND_Y)<20){
      ai.hasBall=true; ball.state='held'; ball.owner=ai;
    }
    return;
  }
  if(ball.owner===ai){
    if(ai.aiTimer<=0){
      ai.aiTimer = 0.4 + Math.random()*0.6;
      const roll = Math.random();
      if(roll < d.aggressiveness*0.5) ai.aiIntent='toDunk';
      else if(roll < d.aggressiveness) ai.aiIntent='toMid';
      else ai.aiIntent='toThree';
    }
    let targetX = CONFIG.HOOP_X - 260;
    if(ai.aiIntent==='toDunk') targetX = CONFIG.HOOP_X - 70;
    else if(ai.aiIntent==='toMid') targetX = CONFIG.HOOP_X - 300;
    else targetX = CONFIG.THREE_PT_X - 60;
    moveToward(ai, targetX, dt, 1);

    // use ability occasionally to close distance or power dunk
    if(Math.random() < 0.003*d.aggressiveness && nowT()>ai.abilityReadyAt) tryActivateAbility(ai);

    const closeEnough = Math.abs(ai.x-targetX) < 26;
    const forcedShot = ai.aiTimer < 0.05 && dist(ai.x,0,CONFIG.HOOP_X,0)<600;
    if(closeEnough || forcedShot){
      if(inDunkZone(ai) && Math.random()<0.8){ doDunk(ai); }
      else {
        const skillRoll = Math.random();
        const q = skillRoll < d.shotSkill*0.5 ? 'perfect' : (skillRoll < d.shotSkill ? 'good' : 'ruim');
        performShot(ai, q);
      }
    }
    return;
  }
  if(ball.owner===hu){
    // defend: get between human and hoop, try steals
    const guardX = clamp(hu.x + 70, CONFIG.HOOP_X-320, CONFIG.HOOP_X-40);
    moveToward(ai, guardX, dt, d.reaction);
    if(ai.stealCooldown<=0 && dist(ai.x,ai.y,hu.x,hu.y)<95 && Math.random()<d.stealChance*dt*4){
      tryStealOrBlock(ai);
    }
  }
}
function moveToward(p, targetX, dt, speedMul){
  const dx = targetX - p.x;
  if(Math.abs(dx) < 4){ p.vx = 0; return; }
  const spd = p.char.speed * speedMul * ((p.abilityUntil>nowT() && p.char.ability.type==='speed_boost')?1.7:1);
  p.vx = clamp(dx, -1, 1) * spd;
  p.facing = dx>0?1:-1;
}

/* ---------------------- Human movement ---------------------- */
function updateHumanMovement(p, dt){
  let dx=0;
  if(Input.isTouch && Input.joy.active){ dx = clamp(Input.joy.dx,-1,1); }
  else {
    if(Input.keys['a']||Input.keys['arrowleft']) dx -= 1;
    if(Input.keys['d']||Input.keys['arrowright']) dx += 1;
  }
  const running = Input.runHeld || Input.keys['shift'];
  let speedMul = running && p.energy>0 ? 1.5 : 1;
  if(running && Math.abs(dx)>0.1){ p.energy = Math.max(0,p.energy - 22*dt); }
  const abilitySpeed = (p.abilityUntil>nowT() && p.char.ability.type==='speed_boost') ? 1.7 : 1;
  p.vx = dx * p.char.speed * speedMul * abilitySpeed;
  if(Math.abs(dx)>0.05) p.facing = dx>0?1:-1;
  if((Input.keys[' ']) ) {} // handled in keydown
}

/* ---------------------- Main update ---------------------- */
let lastT = performance.now();
function tick(){
  const t = performance.now();
  let dt = (t-lastT)/1000; lastT=t;
  dt = Math.min(dt, 0.033);
  if(G.state==='playing') update(dt);
  render();
  requestAnimationFrame(tick);
}
function update(dt){
  G.timeLeft -= dt;
  if(G.timeLeft<=0){ G.timeLeft=0; endMatch(); }
  $('clock').textContent = formatClock(G.timeLeft);
  if(G.bannerTimer>0){ G.bannerTimer-=dt; if(G.bannerTimer<=0) $('banner').classList.remove('show'); }
  if(G.shakeT>0) G.shakeT -= dt;

  updateHumanMovement(G.p1, dt);
  if(Input.isTouch && Input.jumpPressed){ tryJump(G.p1); Input.jumpPressed=false; }
  updateAI(dt);

  [G.p1,G.p2].forEach(p=>{
    // energy regen
    if(!(p===G.p1 && (Input.runHeld||Input.keys['shift']))) p.energy = Math.min(p.char.energyMax, p.energy + 10*dt);
    p.stealCooldown = Math.max(0, p.stealCooldown-dt);
    p.x += p.vx*dt;
    p.x = clamp(p.x, CONFIG.COURT_LEFT+30, CONFIG.COURT_RIGHT-30);
    p.vy += CONFIG.GRAVITY*dt;
    p.y += p.vy*dt;
    if(p.y >= CONFIG.GROUND_Y){ p.y = CONFIG.GROUND_Y; p.vy=0; p.onGround=true; } else p.onGround=false;
    if(p.hasBall){ G.ball.x = p.x + p.facing*26; G.ball.y = p.y - 46 + Math.sin(p.dribblePhase)*4; if(p.onGround && Math.abs(p.vx)>5){ p.dribblePhase += dt*10; } }
    // shoot windup timer
    if(p.shootState && !p.shootState.dunk){
      p.shootState.t += dt;
      p.shootState.power += p.shootState.dir * dt * 140;
      if(p.shootState.power>=100){ p.shootState.power=100; p.shootState.dir=-1; }
      if(p.shootState.power<=0){ p.shootState.power=0; p.shootState.dir=1; }
      if(p===G.p1) updatePowerBarUI(p.shootState.power);
      // AI auto-release timing based on skill
      if(p.isAI){
        const d = DIFF[G.difficulty];
        const target = 86;
        if(Math.abs(p.shootState.power-target) < 10*d.shotSkill+4 && p.shootState.t>0.25){
          tryShootRelease(p);
        } else if(p.shootState.t>1.6){ tryShootRelease(p); }
      }
    }
    if(p.shootState && p.shootState.dunk){ p.shootState.t += dt; if(p.shootState.t>0.4) p.shootState=null; }
  });
  if(!G.p1.shootState) $('powerBarWrap').classList.add('hidden');
  else $('powerBarWrap').classList.remove('hidden');

  updateBall(dt);
  updateEnergyUI();

  G.particles.forEach(pt=>{ pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=900*dt; pt.life-=dt; });
  G.particles = G.particles.filter(pt=>pt.life>0);
  G.floaters.forEach(f=>{ f.y -= 40*dt; f.life -= dt; });
  G.floaters = G.floaters.filter(f=>f.life>0);
}
function updatePowerBarUI(power){
  $('powerCursor').style.left = power+'%';
}
function updateEnergyUI(){
  $('p1Energy').style.width = (G.p1.energy/G.p1.char.energyMax*100)+'%';
  $('p2Energy').style.width = (G.p2.energy/G.p2.char.energyMax*100)+'%';
}
function formatClock(s){ const m=Math.floor(s/60); const sec=Math.floor(s%60); return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }

function updateBall(dt){
  const b = G.ball;
  if(b.state==='held') return;
  if(b.state==='inflight'){
    b.flightT += dt;
    const tt = clamp(b.flightT/b.flightDur, 0, 1);
    b.x = b.from.x + (b.to.x-b.from.x)*tt;
    const arc = Math.sin(tt*Math.PI) * b.arcH;
    b.y = b.from.y + (b.to.y-b.from.y)*tt - arc;
    if(tt>=1){ landBallResult(); }
    return;
  }
  // free ball physics
  b.vy += CONFIG.GRAVITY*dt*0.6;
  b.x += b.vx*dt; b.y += b.vy*dt;
  b.x = clamp(b.x, CONFIG.COURT_LEFT, CONFIG.COURT_RIGHT);
  if(b.y > CONFIG.GROUND_Y-14){
    b.y = CONFIG.GROUND_Y-14; b.vy *= -0.55; b.vx *= 0.8;
    if(Math.abs(b.vy)>40) Audio_.bounce();
    if(Math.abs(b.vy)<60) b.vy=0;
  }
  // pickup check
  [G.p1,G.p2].forEach(p=>{
    if(p.hasBall) return;
    if(dist(p.x,p.y-30,b.x,b.y) < 46){
      p.hasBall = true; b.state='held'; b.owner=p;
      const other = p===G.p1?G.p2:G.p1; other.hasBall=false;
    }
  });
}

/* ---------------------- ARENA + RENDER ---------------------- */
const canvas = $('gameCanvas'); const ctx = canvas.getContext('2d');
function resize(){
  const availW = window.innerWidth, availH = window.innerHeight;
  const scale = Math.min(availW/CONFIG.W, availH/CONFIG.H);
  canvas.style.width = (CONFIG.W*scale)+'px';
  canvas.style.height = (CONFIG.H*scale)+'px';
  const dpr = window.devicePixelRatio||1;
  canvas.width = CONFIG.W*dpr; canvas.height = CONFIG.H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize); resize();

function render(){
  ctx.save();
  if(G.shakeT>0){ ctx.translate((Math.random()*2-1)*6*G.shakeT/0.25, (Math.random()*2-1)*6*G.shakeT/0.25); }
  drawArena();
  if(G.state==='playing' || G.state==='paused'){
    drawPlayer(G.p1);
    drawPlayer(G.p2);
    drawBall();
    drawParticles();
    drawFloaters();
  }
  ctx.restore();
}
function drawArena(){
  // sky/backdrop
  const sky = ctx.createLinearGradient(0,0,0,CONFIG.H);
  sky.addColorStop(0,'#2b1a4a'); sky.addColorStop(0.55,'#4a2f70'); sky.addColorStop(1,'#7a4fae');
  ctx.fillStyle = sky; ctx.fillRect(0,0,CONFIG.W,CONFIG.H);

  // city skyline silhouettes (quadra urbana)
  ctx.fillStyle = 'rgba(20,10,40,0.55)';
  for(let i=0;i<10;i++){
    const bw = 60+((i*37)%50); const bh = 90+((i*53)%160);
    ctx.fillRect(i*130-10, CONFIG.GROUND_Y-160-bh, bw, bh);
  }
  // lights
  for(let i=0;i<26;i++){
    ctx.fillStyle = 'rgba(255,220,150,'+ (0.2+((i*17)%10)/40) +')';
    ctx.fillRect(20+(i*130)%(CONFIG.W-40), CONFIG.GROUND_Y-260-((i*53)%140), 4, 8);
  }

  // bleachers + crowd
  ctx.fillStyle = '#1c1030';
  ctx.fillRect(0, CONFIG.GROUND_Y-90, CONFIG.W, 90);
  for(let i=0;i<70;i++){
    const cx = 10+i*18, cy = CONFIG.GROUND_Y-70+((i%3)*14);
    ctx.fillStyle = ['#ffb703','#ff5e5b','#4dd0e1','#95c8ff','#c9b6ea'][i%5];
    ctx.beginPath(); ctx.arc(cx%CONFIG.W, cy, 5, 0, 7); ctx.fill();
  }

  // floor
  const floor = ctx.createLinearGradient(0,CONFIG.GROUND_Y,0,CONFIG.H);
  floor.addColorStop(0,'#b5793a'); floor.addColorStop(1,'#7a4d22');
  ctx.fillStyle = floor; ctx.fillRect(0, CONFIG.GROUND_Y, CONFIG.W, CONFIG.H-CONFIG.GROUND_Y);
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=3;
  for(let x=CONFIG.COURT_LEFT; x<CONFIG.COURT_RIGHT; x+=60){
    ctx.beginPath(); ctx.moveTo(x,CONFIG.GROUND_Y); ctx.lineTo(x,CONFIG.H); ctx.stroke();
  }
  ctx.strokeStyle='#fff'; ctx.lineWidth=4;
  ctx.strokeRect(CONFIG.COURT_LEFT, CONFIG.GROUND_Y, CONFIG.COURT_RIGHT-CONFIG.COURT_LEFT, CONFIG.H-CONFIG.GROUND_Y);
  // 3pt arc marker (line)
  ctx.beginPath(); ctx.moveTo(CONFIG.THREE_PT_X, CONFIG.GROUND_Y); ctx.lineTo(CONFIG.THREE_PT_X, CONFIG.H); ctx.strokeStyle='rgba(255,183,3,0.85)'; ctx.stroke();
  ctx.fillStyle='rgba(255,183,3,0.85)'; ctx.font='bold 13px Arial'; ctx.fillText('LINHA DE 3', CONFIG.THREE_PT_X-70, CONFIG.GROUND_Y+22);
  // dunk zone marker
  ctx.beginPath(); ctx.moveTo(CONFIG.DUNK_ZONE_X, CONFIG.GROUND_Y); ctx.lineTo(CONFIG.DUNK_ZONE_X, CONFIG.H); ctx.strokeStyle='rgba(255,94,91,0.6)'; ctx.stroke();

  drawHoop();
}
function drawHoop(){
  const hx=CONFIG.HOOP_X, hy=CONFIG.HOOP_Y;
  // pole
  ctx.fillStyle='#3a3a3a'; ctx.fillRect(hx+56, hy-40, 10, CONFIG.GROUND_Y-hy+40);
  // backboard
  ctx.fillStyle='#eaeaea'; ctx.fillRect(hx+40, hy-58, 8, 78);
  ctx.strokeStyle='#ff5e5b'; ctx.lineWidth=3; ctx.strokeRect(hx+40, hy-40, 8, 30);
  // rim
  ctx.strokeStyle='#ff5e5b'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.ellipse(hx, hy, CONFIG.RIM_R, 8, 0, 0, Math.PI*2); ctx.stroke();
  // net
  ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=1.4;
  for(let i=-1;i<=1;i++){
    ctx.beginPath(); ctx.moveTo(hx+i*CONFIG.RIM_R*0.9, hy); ctx.lineTo(hx+i*CONFIG.RIM_R*0.4, hy+34); ctx.stroke();
  }
}
function drawParticles(){
  G.particles.forEach(pt=>{
    ctx.globalAlpha = clamp(pt.life,0,1);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.size,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;
}
function drawFloaters(){
  G.floaters.forEach(f=>{
    ctx.globalAlpha = clamp(f.life,0,1);
    ctx.fillStyle = f.color; ctx.font='bold 22px Arial'; ctx.textAlign='center';
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha=1; ctx.textAlign='left';
}
function drawBall(){
  const b = G.ball;
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.fillStyle='#e8722c';
  ctx.beginPath(); ctx.arc(0,0,CONFIG.BALL_R,0,7); ctx.fill();
  ctx.strokeStyle='#3a1e00'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(-CONFIG.BALL_R,0); ctx.lineTo(CONFIG.BALL_R,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-CONFIG.BALL_R); ctx.lineTo(0,CONFIG.BALL_R); ctx.stroke();
  ctx.restore();
  // shadow
  if(b.state!=='held'){
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(b.x, CONFIG.GROUND_Y+6, 16, 5, 0,0,7); ctx.fill();
  }
}
function drawPlayer(p){
  const c = p.char;
  ctx.save();
  ctx.translate(p.x, p.y);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0, CONFIG.GROUND_Y-p.y+6, 30, 8, 0,0,7); ctx.fill();
  const bob = p.onGround ? Math.sin(p.dribblePhase)*2 : 0;
  ctx.translate(0,bob);
  ctx.scale(p.facing,1);

  const boosted = p.abilityUntil>nowT();
  if(boosted){ ctx.shadowColor = '#ffb703'; ctx.shadowBlur=24; }

  // legs
  ctx.fillStyle = '#241242';
  ctx.fillRect(-16,-16,12,40);
  ctx.fillRect(4,-16,12,40);
  // shoes
  ctx.fillStyle='#fff';
  ctx.fillRect(-18,22,16,8); ctx.fillRect(2,22,16,8);
  // jersey/body
  ctx.fillStyle = c.bodyColor;
  ctx.beginPath(); ctx.ellipse(0,-42,30,34,0,0,7); ctx.fill();

const joyBase = $('joyBase'), joyThumb = $('joyThumb');
function joyRect(){ return joyBase.getBoundingClientRect(); }
function handleJoyStart(e){ Input.joy.active=true; Input.joy.id = e.pointerId; handleJoyMove(e); }
function handleJoyMove(e){
  if(!Input.joy.active || e.pointerId!==Input.joy.id) return;
  const r = joyRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=(e.clientX-cx)/(r.width/2), dy=(e.clientY-cy)/(r.height/2);
  const m = Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }
  Input.joy.dx=dx; Input.joy.dy=dy;

function handleJoyEnd(e){ if(e.pointerId!==Input.joy.id) return; Input.joy.active=false; Input.joy.dx=0; Input.joy.dy=0; joyThumb.style.left='34px'; joyThumb.style.top='34px'; }

function updateAI(dt){

  [G.p2,G.p3,G.p4].forEach(ai=>{
    if(!ai)return; ai.aiTimer-=dt; ai.passCooldown=Math.max(0,ai.passCooldown-dt);

      const close=Math.abs(ai.x-(CONFIG.HOOP_X-70))<32;
      if(ai.aiTimer<=0){ai.aiTimer=.45+Math.random()*.65;
        if(target&&dist(ai.x,ai.y,CONFIG.HOOP_X,CONFIG.HOOP_Y)>300&&Math.random()<.3+d.aggressiveness*.25){passBall(ai);return;}
        if(close&&Math.random()<.72)ai.aiIntent='dunk';else ai.aiIntent=Math.random()<.5?'mid':'three';

}

  else if(c.id==='aguia'){ctx.beginPath();ctx.moveTo(-18,-96);ctx.lineTo(-30,-122);ctx.lineTo(-5,-100);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(18,-96);ctx.lineTo(30,-122);ctx.lineTo(5,-100);ctx.closePath();ctx.fill();}
  else {ctx.beginPath();ctx.moveTo(-18,-96);ctx.lineTo(-30,-118);ctx.lineTo(-8,-98);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(18,-96);ctx.lineTo(30,-118);ctx.lineTo(8,-98);ctx.closePath();ctx.fill()}
  ctx.fillStyle=c.id==='raposa'?'#fff':'#f4d9a0';ctx.beginPath();ctx.ellipse(14,-72,11,8,0,0,7);ctx.fill();ctx.fillStyle='#241242';ctx.beginPath();ctx.arc(22,-72,2.4,0,7);ctx.fill();ctx.beginPath();ctx.arc(6,-84,3,0,7);ctx.fill();ctx.beginPath();ctx.arc(-8,-84,3,0,7);ctx.fill();ctx.shadowBlur=0;ctx.restore();
  ctx.save();ctx.textAlign='center';ctx.font='bold 11px Arial';ctx.fillStyle='#fff';ctx.fillText(p.isAI?p.char.name.toUpperCase():'VOCÊ',p.x,p.y-125);ctx.fillStyle=p.team==='left'?'#7dd3fc':'#ff8b8b';ctx.fillRect(p.x-22,p.y-119,44,3);ctx.restore();
}
function render(){ctx.save();if(G.shakeT>0)ctx.translate((Math.random()*2-1)*6*G.shakeT/.25,(Math.random()*2-1)*6*G.shakeT/.25);drawArena();if(G.state==='playing'||G.state==='paused'){allPlayers().forEach(drawPlayer);drawBall();drawParticles();drawFloaters()}ctx.restore()}

// Passe no teclado e HUD/controles atualizados.
window.addEventListener('keydown',e=>{if(G.state==='playing'&&e.key.toLowerCase()==='k')passBall(G.p1)});
$('btnStartMatch').textContent='INICIAR PARTIDA (2v2)';
$('kbHint').textContent='WASD/Setas: mover · Espaço: pular · J: arremesso/enterrada · K: passe · E: roubar/bloquear · Shift: correr · L: habilidade';

</script>
